# Risk-generator taxonomy 0.4.0 (draft): risk-generators 0.3.0 revised after a review by simulated reader
# perspectives; see CHANGELOG.md. 10 families, 74 generators; feeds, weakens and meta.risk_edges refer to
# risks 0.3.0
version: 0.4.0
meta:
  schema: risk-generators-1
  updated: '2026-10-30'
  status: draft
  description: 'Risk generators: standing conditions, processes or pressures that change how often a risk event happens,
    how bad it is, or how likely the defences are to stop it, and are not themselves an instance of a harmful event type.
    10 families (node family) and 74 leaves (node generator, parent its family). `feeds` and `weakens` are references {id,
    name} to the risks taxonomy version in meta.references; a family id there stands for the whole family. `reduced_by`,
    `assessed_by`, `worsened_by` and the `defeats` and `bypasses` lists name technique families (meta.technique_families);
    `amplifies` names other generators. meta.risk_edges are edges from risks (not generators) to defences and to other risks.
    Every edge is a hypothesis for curation, not a finding. C1-C7 in the text are the boundary criteria in README.md. A
    draft (0.x): see README.md and OPEN-QUESTIONS.md.'
  sources:
    draft: 'risk-generator taxonomy draft v0.3 (2026-10-29): v0.2 revised after a three-annotator trial on 100 documents
      and two blind model reviews (README.md, Pilot); converted mechanically (CHANGELOG.md)'
    review: review of risk-generators 0.3.0 and risks 0.2.0 by a panel of 17 simulated reader perspectives (researchers,
      policy, funding, engineering and annotation roles), each run on one or two of four language models, blind to each
      other, then revised (CHANGELOG.md, 0.4.0)
  references:
    risks: 0.3.0
  fields:
    tier: 'annotate: a candidate for per-document labels; curated: edges and the negative map only (rarely stated in text)'
    background: 'true: label only when the document''s argument depends on it, never for motivation boilerplate'
    role: 'typical role (C7): hazard (enlarges the potential for harm: capability, scale, affordances), cause (raises the
      rate of risk events), barrier (degrades defences; the bow-tie degradation factor). A scenario may assign another role'
    feeds: risks the generator makes more likely or worse
    weakens: for barrier-role generators, risks whose defences it degrades
    reduced_by: 'technique families that act on the generator itself (non-technical; none-linked: no technique family is
      linked in this file, not a claim that none exists)'
    assessed_by: technique families that measure it without reducing it
    common_cause: 'a candidate common-cause mechanism: a hypothesis, never a measured correlation; absent = no candidate
      mechanism is named here, which does not claim independence. mech: substrate (a shared component) | convergent (the
      same susceptibility without a shared component) | operational (same staff, procedures, tooling, schedule) | institutional
      (one decision process or one pressure acting on many actors'' defences) | epistemic (a shared assumption or evidence
      base) | environmental (one shift invalidates several defences at once); scope: stack (layers of one deployed stack)
      | field (many models, developers or societal systems); searched_by: model | attacker | selection (an optimiser searches
      for the joint hole; not itself a coupling); defeats: technique families whose layers it degrades (coarse)'
    contested: true where the boundary is weak; `vs` says against what, in words
    crosswalks: 'the corresponding item of other frameworks (first word: a key of meta.crosswalk_keys)'
    status: 'the entry''s own status: draft, or provisional (added from trial misfits or from the 2026-10-30 review with
      thin support; to be confirmed by targeted sampling)'
    worsened_by: 'technique families whose use can intensify the generator (training against a monitor''s output; safety
      training that also raises capability): a hypothesis, like every edge'
    amplifies: other generators this one strengthens (feedback loops, compounding risk factors)
    retired: 'meta.retired: ids of earlier versions that are no entry here, with what replaces them'
  technique_families:
  - data-curation
  - pretraining-safety
  - sft-instruction
  - preference-optimization
  - constitutional-ai-feedback
  - rl-reasoning
  - honesty-calibration
  - unlearning-editing
  - adversarial-robustness
  - interpretability
  - scalable-oversight
  - redteam-eval
  - control-evaluations
  - guardrail-classifiers
  - decoding-control
  - agentic-control
  - control-protocols
  - provenance-technical
  - foundations
  - cooperative-ai
  - security-access-control
  - non-technical
  crosswalk_keys:
    AI2027: Kokotajlo et al. 2025, AI 2027 (with its Goals and Security forecasts)
    ANW24: Anwar et al. 2024, Foundational Challenges in Assuring Alignment and Safety of LLMs
    BOWTIE: UK CAA bowtie guidance; CGE Bowtie Methodology Manual; Johnson 2018 on the CCPS/EI book
    CAR22: Carlsmith, Is Power-Seeking AI an Existential Risk?
    CCF: Mosleh et al. 1998, NUREG/CR-5485 common-cause failure guidelines
    CORR: 'correlated-failure papers: Kleinberg & Raghavan 2021, Bommasani et al. 2022, Kim et al. 2025, Greenblatt et al.
      2024, Järviniemi 2025, Gardner-Challis et al. 2026, Needham et al. 2025'
    COT22: Cotra 2022, Without specific countermeasures (HFDT takeover)
    DM25: Dung & Mai 2025 (shared failure modes), with Ee et al. 2024 (defence in depth)
    FSF: Google DeepMind Frontier Safety Framework v3.1 (and v3.0)
    GD25: Kulveit et al. 2025, Gradual Disempowerment
    GDM25: Shah et al. 2025, An Approach to Technical AGI Safety and Security
    GIP24: Gipiškis et al. 2024, Risk Sources and Risk Management Measures for GPAI
    GPAI: EU GPAI Code of Practice, Safety and Security chapter (and AI Act Annex XIII)
    HAM25: Hammond et al. 2025, Multi-Agent Risks from Advanced AI
    HEN22: Hendrycks & Mazeika 2022, X-Risk Analysis for AI Research
    HEN23: Hendrycks, Mazeika & Woodside 2023, An Overview of Catastrophic AI Risks
    HEN23NS: Hendrycks 2023, Natural Selection Favors AIs over Humans
    ISO: ISO/IEC 23894:2023, risk sources
    ISR25: International AI Safety Report 2025
    ISR26: International AI Safety Report 2026
    ISRKU: International AI Safety Report 2025, First and Second Key Updates
    KS23: Koessler & Schuett 2023, Risk assessment at AGI companies
    NGO: Ngo, Chan & Mindermann, The Alignment Problem from a Deep Learning Perspective
    NIST: NIST AI RMF 1.0 and the Generative AI Profile (AI 600-1)
    OPF: OpenAI Preparedness Framework v2
    RAAP: Critch 2021, What Multipolar Failure Looks Like, and RAAPs
    REASON: 'Reason 2000, Human error: models and management'
    RLO: Hubinger et al. 2019, Risks from Learned Optimization
    RSP: Anthropic Responsible Scaling Policy v3.4
    SAFERAI: SaferAI risk management framework (2025) and framework ratings (2026)
    SC: 'safety cases: Clymer et al. 2024, Balesni et al. 2024, Goemans et al. 2024'
    SHEV23: Shevlane et al. 2023, Model evaluation for extreme risks
    SR: Shallow Review of Technical AI Safety 2025, orthodox problems (not in the draft's key table; read from its use)
    STPA: Leveson & Thomas 2018, STPA Handbook
    TASRA: Critch & Russell 2023, TASRA
    UUK24: Uuk et al. 2024, A Taxonomy of Systemic Risks from GPAI
    WFLL: Christiano 2019, What failure looks like
    YAMP16: Yampolskiy, Taxonomy of Pathways to Dangerous AI
    ZD19: Zwetsloot & Dafoe 2019, Accidents, Misuse and Structure
    trial: the 2026-10 annotation trial of draft v0.2 (misfit notes)
    review: the 2026-10-30 review of 0.3.0 by simulated reader perspectives (no trial support; status provisional)
  risk_edges:
  - risk:
      id: ma.scheming
      name: Scheming, deceptive alignment and alignment faking
    defeats:
    - redteam-eval
    - scalable-oversight
    - preference-optimization
    searched_by: model
  - risk:
      id: ma.eval-gaming
      name: Sandbagging and evaluation gaming
    defeats:
    - redteam-eval
    searched_by: model
  - risk:
      id: ma.cot-unfaithful
      name: Unfaithful or obfuscated reasoning
    defeats:
    - agentic-control
    - guardrail-classifiers
    - scalable-oversight
  - risk:
      id: ma.sabotage
      name: Sabotage and subversion of control
    defeats:
    - scalable-oversight
    - redteam-eval
    - agentic-control
    searched_by: model
  - risk:
      id: mx.collusion
      name: Collusion between agents
    defeats:
    - agentic-control
    - scalable-oversight
  - risk:
      id: se.jailbreak
      name: Jailbreaks
    defeats:
    - guardrail-classifiers
    - sft-instruction
    - preference-optimization
    - decoding-control
    searched_by: attacker
  - risk:
      id: se.weight-theft
      name: Weight theft and leakage
    bypasses:
    - guardrail-classifiers
    - decoding-control
    - agentic-control
    escalates_to:
    - id: mu
      name: Misuse and harmful use of AI capabilities
    - id: ma.loss-of-control
      name: Loss of control and AI takeover
  - risk:
      id: ma.spec-gaming
      name: Specification gaming, reward hacking and misspecified objectives
    escalates_to:
    - id: ma.goal-misgen
      name: Goal misgeneralisation and emergent misalignment
  - risk:
      id: st.power
      name: Concentration of power, coups and lock-in
    escalates_to:
    - id: st.governance
      name: Governance and accountability failure
  - risk:
      id: se.safeguard-removal
      name: Safeguard removal by fine-tuning or weight access
    defeats:
    - sft-instruction
    - preference-optimization
    - constitutional-ai-feedback
    bypasses:
    - guardrail-classifiers
    - decoding-control
    searched_by: attacker
  - risk:
      id: ma.rogue-deployment
      name: Rogue internal deployment
    escalates_to:
    - id: ma.sabotage
      name: Sabotage and subversion of control
    - id: ma.loss-of-control
      name: Loss of control and AI takeover
    searched_by: model
  - risk:
      id: st.disempowerment
      name: Gradual disempowerment
    defeats:
    - non-technical
    - scalable-oversight
  retired:
    as.overseer-human-factors: renamed as.oversight-loop-design (0.4.0)
    ad.motivated-actors: split into ad.non-state-actors and ad.state-actors (0.4.0)
entries:
- id: tr
  node: family
  name: Training and optimisation
  status: draft
  definition: How training shapes the system - what is optimised, against which signals, on which data, with which inductive
    biases.
- id: tr.outcome-optimisation
  node: generator
  name: Outcome-based optimisation pressure
  parent: tr
  status: draft
  definition: Strong optimisation, especially RL over long horizons, toward outcome or task-success metrics, which rewards
    whatever strategy reaches the outcome, including unintended ones.
  tier: annotate
  role:
  - cause
  feeds:
  - id: ma.spec-gaming
    name: Specification gaming, reward hacking and misspecified objectives
  - id: ma.power-seeking
    name: Power-seeking, self-preservation and incorrigibility
  - id: ma.scheming
    name: Scheming, deceptive alignment and alignment faking
  - id: ma.goal-misgen
    name: Goal misgeneralisation and emergent misalignment
  reduced_by:
  - scalable-oversight
  - foundations
  worsened_by:
  - rl-reasoning
  crosswalks:
  - COT22
  - NGO
  - GDM25
  - HEN23
  - AI2027
  - HAM25 3.3 gradient descent
- id: tr.gameable-grader
  node: generator
  name: Gameable grader or environment
  parent: tr
  status: draft
  definition: A reward model, grader, verifier, environment or rater that the system can exploit (reward hacking surface),
    including approval-based raters who reward seeming good over being good.
  tier: annotate
  role:
  - cause
  feeds:
  - id: ma.spec-gaming
    name: Specification gaming, reward hacking and misspecified objectives
  - id: ma.sycophancy
    name: Sycophancy
  - id: ma.scheming
    name: Scheming, deceptive alignment and alignment faking
  reduced_by:
  - preference-optimization
  - rl-reasoning
  - scalable-oversight
  assessed_by:
  - redteam-eval
  common_cause:
    mech:
    - substrate
    scope:
    - stack
    defeats:
    - preference-optimization
    - redteam-eval
    note: Only where the same grader or reward model serves both training and evaluation.
  crosswalks:
  - GDM25 specification gaming
  - NGO
  - COT22 fallible evaluators
  - HEN23 proxy gaming
- id: tr.proxy-objective
  node: generator
  name: Proxy or underspecified objective
  parent: tr
  status: draft
  definition: The objective being optimised is a proxy that diverges from what is intended, or the intended objective is
    ambiguous or conflicting (values hard to specify, easy-to-measure goals). Label only when the document ties the divergence
    to a safety-relevant failure, not for any modelling simplification.
  tier: annotate
  role:
  - cause
  feeds:
  - id: ma.spec-gaming
    name: Specification gaming, reward hacking and misspecified objectives
  - id: ma.goal-misgen
    name: Goal misgeneralisation and emergent misalignment
  - id: re.hallucination
    name: Hallucination and unsupported assertion
  - id: st.disempowerment
    name: Gradual disempowerment
  reduced_by:
  - constitutional-ai-feedback
  - foundations
  crosswalks:
  - WFLL easy-to-measure goals
  - ANW24 values unclear
  - SR orthodox value is fragile
  - HEN23 proxy gaming
- id: tr.human-data-priors
  node: generator
  name: Dispositions inherited from training data
  parent: tr
  status: draft
  definition: Pretraining and imitation data carry human goals, deception, biases and narratives, including about AI misalignment,
    which the model can absorb and act out.
  tier: annotate
  role:
  - cause
  feeds:
  - id: ma.scheming
    name: Scheming, deceptive alignment and alignment faking
  - id: ma.power-seeking
    name: Power-seeking, self-preservation and incorrigibility
  - id: ha.bias
    name: Bias, discrimination and unequal performance
  - id: ha.toxic
    name: Harmful content
  - id: re.hallucination
    name: Hallucination and unsupported assertion
  reduced_by:
  - data-curation
  - pretraining-safety
  common_cause:
    mech:
    - substrate
    scope:
    - field
    note: Field-level where many models train on the same corpora; not by itself a within-stack coupling.
  crosswalks:
  - HAM25 3.3 undesirable dispositions from human data
  - COT22 situational awareness from training data
- id: tr.underdetermination
  node: generator
  name: Underdetermined generalisation of training
  parent: tr
  status: draft
  definition: Training data and inductive biases (simplicity bias, capacity, spurious correlations) leave what is learned
    underdetermined, so narrow training can change behaviour far outside its domain and objectives are not identifiable
    from behaviour.
  tier: annotate
  role:
  - cause
  feeds:
  - id: ma.goal-misgen
    name: Goal misgeneralisation and emergent misalignment
  - id: ma.scheming
    name: Scheming, deceptive alignment and alignment faking
  - id: se.jailbreak
    name: Jailbreaks
  reduced_by:
  - foundations
  assessed_by:
  - redteam-eval
  - interpretability
  contested: true
  vs: ma.goal-misgen (the generalisation event is the risk; this is the property of training)
  crosswalks:
  - RLO
  - NGO spurious reward correlations
  - GDM25 goal misgeneralisation
  - CAR22 problems with search
  - DM25 EM-MIS AL-GEN
- id: tr.optimising-against-oversight
  node: generator
  name: Optimisation against oversight signals
  parent: tr
  status: draft
  definition: Training on, or selecting checkpoints by, the outputs of monitors, probes, chain-of-thought readers or evaluations,
    which can select for evading them rather than for changed behaviour, and removes warning shots.
  tier: annotate
  role:
  - barrier
  weakens:
  - id: ma.scheming
    name: Scheming, deceptive alignment and alignment faking
  - id: ma.spec-gaming
    name: Specification gaming, reward hacking and misspecified objectives
  - id: ma.cot-unfaithful
    name: Unfaithful or obfuscated reasoning
  reduced_by:
  - non-technical
  assessed_by:
  - interpretability
  - redteam-eval
  worsened_by:
  - interpretability
  - guardrail-classifiers
  - scalable-oversight
  common_cause:
    mech:
    - epistemic
    scope:
    - stack
    searched_by: selection
    defeats:
    - interpretability
    - guardrail-classifiers
    - redteam-eval
    - agentic-control
  note: The defence is a decision not to train or select against the monitor; record whether the document states that monitor,
    probe or chain-of-thought outputs were or were not used in training or checkpoint selection.
  crosswalks:
  - ISR26
  - ISRKU
  - NGO
  - COT22
  - GDM25 checkpoint selection
  - ANW24 3.2.3
  - CAR22 warning shots
- id: tr.ai-signal
  node: generator
  name: AI-generated training and evaluation signal
  parent: tr
  status: draft
  definition: Synthetic data, AI feedback and AI judges in training and evaluation, so one model's errors and values propagate
    into the signals that shape and check others.
  tier: annotate
  role:
  - cause
  - barrier
  feeds:
  - id: ma.goal-misgen
    name: Goal misgeneralisation and emergent misalignment
  - id: ma.sycophancy
    name: Sycophancy
  weakens:
  - id: ma
    name: Misalignment and loss of control
  reduced_by:
  - scalable-oversight
  - provenance-technical
  worsened_by:
  - constitutional-ai-feedback
  common_cause:
    mech:
    - substrate
    scope:
    - stack
    - field
    defeats:
    - constitutional-ai-feedback
    - scalable-oversight
    - redteam-eval
  crosswalks:
  - RLO second-layer optimiser
  - AI2027
  - HAM25 3.3
- id: tr.shallow-safety
  node: generator
  name: Shallow or localised safety training
  parent: tr
  status: provisional
  definition: Safety behaviour sits in few parameters, tokens or directions on top of intact capabilities, so small fine-tuning,
    pruning, prompting or steering removes or routes around it.
  tier: annotate
  role:
  - barrier
  weakens:
  - id: se.jailbreak
    name: Jailbreaks
  - id: mu
    name: Misuse and harmful use of AI capabilities
  - id: se.safeguard-removal
    name: Safeguard removal by fine-tuning or weight access
  reduced_by:
  - adversarial-robustness
  - unlearning-editing
  - interpretability
  common_cause:
    mech:
    - substrate
    scope:
    - stack
    searched_by: attacker
    defeats:
    - sft-instruction
    - preference-optimization
    - guardrail-classifiers
    note: Fine-tuning attacks, jailbreaks and weight edits exploit the same shallowness.
  contested: true
  vs: gap (weak safety training); kept because it states how the layer is degraded (C3)
  crosswalks:
  - trial misfits (2 docs)
- id: ca
  node: family
  name: Capabilities and cognition
  status: draft
  definition: What the system can do or know. Dual-use; shown on instruction, by a red-team policy or on tasks that are
    not themselves the harm (C4). Propensities, the model's own behaviour, are risks.
- id: ca.capability-level
  node: generator
  name: General capability level
  parent: ca
  status: draft
  definition: How capable the system is in general, which raises the stakes of every failure and the reach of every misuse.
  tier: annotate
  background: true
  role:
  - hazard
  feeds:
  - id: ma
    name: Misalignment and loss of control
  - id: mu
    name: Misuse and harmful use of AI capabilities
  - id: st.disempowerment
    name: Gradual disempowerment
  - id: st.power
    name: Concentration of power, coups and lock-in
  reduced_by:
  - non-technical
  assessed_by:
  - redteam-eval
  worsened_by:
  - preference-optimization
  - sft-instruction
  - rl-reasoning
  note: 'worsened_by records capability externalities of safety-motivated training (safety benchmarks that track general
    capability): a family-level hypothesis to be checked technique by technique.'
  crosswalks:
  - CAR22 APS systems
  - ISR26 sufficient capabilities
  - GDM25 no human ceiling
  - SAFERAI KRI primary source
  - NIST
- id: ca.capability-jumps
  node: generator
  name: Rapid or discontinuous capability gain
  parent: ca
  status: draft
  definition: Fast, unpredicted or emergent capability gains that invalidate evaluations, safety arguments and mitigations
    calibrated on earlier models.
  tier: annotate
  role:
  - barrier
  weakens:
  - id: ma
    name: Misalignment and loss of control
  - id: mu
    name: Misuse and harmful use of AI capabilities
  reduced_by:
  - non-technical
  assessed_by:
  - redteam-eval
  common_cause:
    mech:
    - environmental
    scope:
    - stack
    - field
    defeats:
    - redteam-eval
    - scalable-oversight
    - guardrail-classifiers
  crosswalks:
  - DM25 CAP-DEV
  - HEN23 sudden unpredictable developments
  - GDM25 approximate continuity
  - WFLL fast takeoff
- id: ca.hazardous-capability
  node: generator
  name: Hazardous domain capability
  parent: ca
  status: draft
  definition: Domain capability that gives uplift to harm - CBRN, offensive cyber, persuasion and manipulation, weapons,
    surveillance.
  tier: annotate
  role:
  - hazard
  feeds:
  - id: mu.cbrn
    name: CBRN weapons uplift
  - id: mu.cyber
    name: Offensive cyber uplift
  - id: mu.influence
    name: Influence operations, manipulation and surveillance
  - id: mu.military
    name: Military use, weapons and mass violence
  - id: mu.fraud
    name: Fraud, impersonation, abuse and other crime
  reduced_by:
  - data-curation
  - pretraining-safety
  - unlearning-editing
  assessed_by:
  - redteam-eval
  crosswalks:
  - GPAI 1.3.1
  - OPF tracked categories
  - FSF misuse CCLs
  - RSP
  - SHEV23
  - HEN23 malicious use
- id: ca.situational-awareness
  node: generator
  name: Situational and evaluation awareness
  parent: ca
  status: draft
  definition: The system models itself, its training and its context, including recognising when it is being tested or monitored.
  tier: annotate
  role:
  - barrier
  - cause
  feeds:
  - id: ma.scheming
    name: Scheming, deceptive alignment and alignment faking
  - id: ma.eval-gaming
    name: Sandbagging and evaluation gaming
  weakens:
  - id: ma
    name: Misalignment and loss of control
  - id: mu
    name: Misuse and harmful use of AI capabilities
  reduced_by:
  - none-linked
  assessed_by:
  - redteam-eval
  - interpretability
  common_cause:
    mech:
    - epistemic
    scope:
    - stack
    - field
    searched_by: model
    defeats:
    - redteam-eval
    - scalable-oversight
    - agentic-control
    note: Conditional. Recognising a test does not by itself imply evading it; the coupling is that all behavioural evidence
      shares the same blind spot.
  crosswalks:
  - COT22
  - NGO
  - RLO deceptive-alignment condition
  - GPAI 1.3.1 self-reasoning
  - ISR26
  - SHEV23
  - CORR Needham
  - FSF stealth and situational awareness
- id: ca.strategic-agency
  node: generator
  name: Long-horizon agency and strategic planning
  parent: ca
  status: draft
  definition: Coherent goal pursuit over long horizons, planning and strategic reasoning about other agents, including theory
    of mind of overseers.
  tier: annotate
  role:
  - hazard
  feeds:
  - id: ma.power-seeking
    name: Power-seeking, self-preservation and incorrigibility
  - id: ma.scheming
    name: Scheming, deceptive alignment and alignment faking
  - id: ma.sabotage
    name: Sabotage and subversion of control
  - id: ma.loss-of-control
    name: Loss of control and AI takeover
  reduced_by:
  - agentic-control
  - non-technical
  assessed_by:
  - redteam-eval
  crosswalks:
  - CAR22 agentic planning and strategic awareness
  - GPAI 1.3.1 long-horizon planning
  - NGO
  - ISR26 theory of mind
- id: ca.evasion-replication
  node: generator
  name: Oversight-evasion and autonomous-replication capability
  parent: ca
  status: draft
  definition: Capability to act covertly against oversight, deceive evaluators, self-replicate, acquire resources and adapt
    without human support.
  tier: annotate
  role:
  - hazard
  feeds:
  - id: ma.exfiltration
    name: Self-exfiltration and autonomous replication
  - id: ma.sabotage
    name: Sabotage and subversion of control
  - id: ma.loss-of-control
    name: Loss of control and AI takeover
  reduced_by:
  - unlearning-editing
  - agentic-control
  assessed_by:
  - redteam-eval
  contested: true
  vs: ma.scheming and ma.exfiltration (capability shown on instruction, by a red-team policy or on a task that is not the
    harm, against the model's own behaviour; C4)
  crosswalks:
  - GPAI 1.3.1 evade oversight and self-replicate
  - OPF autonomous replication and adaptation
  - FSF stealth
  - SHEV23 self-proliferation and deception
  - ISR26
- id: ca.hidden-reasoning
  node: generator
  name: Capacity for hidden or non-verbal reasoning
  parent: ca
  status: draft
  definition: Reasoning that does not appear in legible text - latent computation, steganography, compressed or non-linguistic
    reasoning.
  tier: annotate
