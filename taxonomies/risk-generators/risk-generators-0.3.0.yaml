  common_cause:
    mech:
    - environmental
    scope:
    - stack
    - field
    defeats:
    - redteam-eval
    - scalable-oversight
  crosswalks:
  - AI2027
  - GPAI 1.3.1 automate AI R&D
  - FSF cross-cutting risk factor
  - RSP automated R&D
- id: as
  node: family
  name: Limits of assurance and oversight
  status: draft
  definition: Conditions that defeat defences rather than create hazards - what makes it hard to know or check whether a
    system is safe.
- id: as.opacity
  node: generator
  name: Opacity of learned systems
  parent: as
  status: draft
  definition: Internal computation is not understood, so behaviour cannot be predicted or audited from inspection and assurance
    must rest on behaviour.
  tier: annotate
  role:
  - barrier
  weakens:
  - id: ma
    name: Misalignment and loss of control
  - id: re
    name: Reliability and accidents
