  status: draft
  definition: False or unsupported outputs (fabricated facts and citations, imitated misconceptions) where the document
    does not show that the model knew better.
  exclude: Saying what the user wants to hear is ma.sycophancy; stating what the model has evidence is false is ma.manipulation
