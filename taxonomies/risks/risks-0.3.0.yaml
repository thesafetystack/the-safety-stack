  status: draft
  definition: Human influence over the economy, culture and states erodes or is lost as these systems come to rely on AI
    rather than human participation, and with it the human capacity to correct them (including to correct AI); enfeeblement;
    irreversible handover, gradual or in a fast collective failure in which systems that serve their principals outrun human
    correction. The AI systems involved may serve their principals faithfully.
  exclude: An individual losing autonomy through reliance on an assistant is ha.reliance; job loss as such is ha.labour;
    takeover by AI acting against its overseers is ma.loss-of-control.
