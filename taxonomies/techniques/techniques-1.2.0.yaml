- id: adversarial-training-jailbreak-robustness
  node: technique
  name: Adversarial training (jailbreak/harmful-request robustness)
  kind: intervention
  status: final
  origin: v0.8
  layer: robustness-tamper
  definition: Trains a model on adversarially constructed harmful requests or jailbreaks with safe-response targets, preference signals or safety rewards, so that it keeps behaving safely under attack. The defining element is exposure to attacks during optimisation; neither SFT nor an outright refusal target is required, and robustness is measured on attacks, not guaranteed beyond them. Not runtime attack detection (prompt-injection-jailbreak-detector), perturbations in activation space (latent-adversarial-training) or perturbation attacks that change a model's prediction or task output rather than elicit policy-violating content (adversarial-example-robustness).
