  layer: agent-control
  definition: Executes agent code or tool operations inside an isolation boundary that restricts filesystem, network, process and resource access, limiting consequences under a stated threat model. Effectiveness depends on the isolation mechanism, configuration and escape paths; it does not guarantee that actions cannot escape. Not permission provisioning (least-privilege-minimal-tool-access).
  counts_when: Counts for a specified isolation boundary around an AI system or an agent's actions with a safety or security rationale, including air-gapped deployment of a model; container isolation of software with no AI component gets no row. 'AI boxing' as a thought experiment about containing a superintelligent system is agent-foundations material outside this taxonomy; it counts here only when the document describes an implemented or concretely specified isolation boundary.
