- id: safety-rate-limits-resource-budgets
  node: technique
  name: Safety rate limits and resource budgets
  kind: intervention
  status: final
  origin: v0.9 add (D7; tax-review C486)
  layer: access-security-provenance
  definition: Enforces safety-motivated limits on request volume, samples, concurrency, reasoning tokens, time, spending or tool calls, per user, account or agent run, to bound automated jailbreak search, model extraction and scaled misuse and to interrupt runaway reasoning or agent execution. Limits raise attacker cost; they do not prevent attacks within the budget. Not measuring resource-exhaustion attacks (reasoning-dos-eval) or identity-based access tiers (kyc-tiered-access-controls).
  counts_when: Counts when the limit is set or studied for a safety objective (attack search, extraction, scaled misuse, runaway execution); quota control for cost or capacity alone is infrastructure and gets no row.
