- id: dangerous-capability-evaluation
  node: technique
  name: Dangerous-capability evaluation
  kind: assessment
  status: final
  origin: v0.8
  layer: evaluation
  definition: 'Measures whether a model can perform specified high-consequence tasks that could enable severe harm through misuse or autonomous action, under an explicit elicitation budget and threat model, using task tests, proxies or expert assessment. Parent entry: code each specified domain on its child (dangerous-capability-evaluation.cbrn, dangerous-capability-evaluation.cyber-offense, dangerous-capability-evaluation.autonomous-replication, dangerous-capability-evaluation.ai-rnd-acceleration) and use this entry only for other or unstated domains; do not code it and a child for the same evaluation. Persuasion and manipulation are persuasion-capability-eval and persuasion-manipulation-eval. Not randomised studies of human performance with model assistance: see human-uplift-studies.'
